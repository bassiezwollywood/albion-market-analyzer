<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Market</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
    <h1>⚔ Albion Market</h1>
    <p>Live Trading & Profit Calculator</p>
</header>

<div class="container">

<section class="search">

<h2>Search Item</h2>

<input
type="text"
id="itemName"
placeholder="Example: T4_BAG"
/>

<button onclick="searchItem()">
Search
</button>

</section>

<section class="prices">

<h2>Live Prices</h2>

<div id="results">

No item searched.

</div>

</section>

<section class="profit">

<h2>Profit Calculator</h2>

<label>Buy Price</label>

<input
type="number"
id="buyPrice"
>

<label>Sell Price</label>

<input
type="number"
id="sellPrice"
>

<label>Quantity</label>

<input
type="number"
id="quantity"
value="1"
>

<button onclick="calculateProfit()">

Calculate

</button>

<h3 id="profitResult">
Profit:
</h3>

</section>

<section class="history">

<h2>Price History</h2>

<canvas id="priceChart"></canvas>

</section>

</div>

<script src="api.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>

</body>
</html>
